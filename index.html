<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jeyson</title>
<meta name="description" content="Jeyson: un muñequito que te espera, te pregunta y construye su casa contigo.">
<meta name="theme-color" content="#0b0e0c">
<link rel="manifest" href="./manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jeyson">

<style>
:root{--bg:#0b0e0c;--card:#131a16;--card2:#0f1512;--line:#24352b;--accent:#3ee07f;--txt:#e9f2ec;--dim:#8ba294;--warn:#e0b83a;--bad:#e05a5a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
body{padding:calc(8px + env(safe-area-inset-top)) 12px calc(16px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.brand{display:flex;align-items:center;gap:8px;font-size:15px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.lvl{font-size:11px;color:var(--dim);border:1px solid var(--line);padding:2px 7px;border-radius:20px}
.btn{font:inherit;font-size:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--txt);padding:7px 10px;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.ghost{background:transparent}
.btn.solid{background:var(--accent);color:#06210f;border-color:var(--accent);font-weight:600}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.4}
.escena{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;padding:12px;border-radius:18px;background:radial-gradient(120% 90% at 50% 0%,#16241c,#0b0f0d);border:1px solid var(--line);overflow:hidden;min-height:216px}
.char{position:relative;width:120px;height:148px;animation:respirar 3.6s ease-in-out infinite;transition:filter .5s}
.cabeza{position:absolute;left:50%;top:0;transform:translateX(-50%);width:86px;height:78px;border-radius:46% 46% 44% 44%;background:linear-gradient(160deg,#3ee07f,#1c8b4b);box-shadow:0 0 24px rgba(62,224,127,.18)}
.ojo{position:absolute;top:32px;width:11px;height:13px;border-radius:50%;background:#06210f;animation:parpadear 5.5s infinite}
.ojo.i{left:21px}.ojo.d{right:21px}
.boca{position:absolute;left:50%;transform:translateX(-50%);bottom:15px;width:24px;height:10px;border-radius:0 0 22px 22px;background:#06210f}
.torso{position:absolute;left:50%;top:72px;transform:translateX(-50%);width:104px;height:72px;border-radius:26px 26px 14px 14px;background:#1b2a21;border:2px solid #2c4a38}
.brazo{position:absolute;top:84px;width:18px;height:50px;border-radius:12px;background:#182a20;border:2px solid #2c4a38;transform-origin:top center}
.brazo.i{left:1px}.brazo.d{right:1px}
.prop{position:absolute;left:50%;top:50px;transform:translateX(-50%);font-size:26px;opacity:0;pointer-events:none}
.corazones{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.corazones i{position:absolute;left:50%;top:60px;font-size:18px;opacity:0;animation:flotar 1.6s ease-out forwards;font-style:normal}
.bubble{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 12px;font-size:13px;line-height:1.45;max-width:94%;text-align:center;min-height:38px;display:flex;align-items:center;justify-content:center}
.char.mimir .ojo{height:3px;border-radius:2px;animation:none}
.char.triste .boca{border-radius:22px 22px 0 0;bottom:13px}
.char.triste .cabeza{filter:saturate(.55)}
.escena[data-anim="comer"] .prop{animation:aparecer 2.1s ease-in-out forwards}
.escena[data-anim="comer"] .boca{animation:masticar .35s ease-in-out 6}
.escena[data-anim="abrigo"] .char{animation:temblar .28s 4}
.escena[data-anim="abrigo"] .prop{animation:aparecer 2.1s ease-out forwards}
.escena[data-anim="arropar"] .char{animation:mecer 2.2s ease-in-out}
.escena[data-anim="arropar"] .prop{animation:aparecer 2.1s ease-out forwards}
.escena[data-anim="cafe"] .prop{animation:subir 2.1s ease-out forwards}
.escena[data-anim="guitarra"] .brazo.d{animation:rascar .3s ease-in-out 6}
.escena[data-anim="guitarra"] .prop{animation:aparecer 2.1s ease-out forwards}
.escena[data-anim="abrazo"] .char{animation:latir .5s ease-in-out 4}
.escena[data-anim="abrazo"] .prop{animation:aparecer 1.8s ease-out forwards}
.escena[data-anim="jugar"] .char{animation:saltar .5s ease-in-out 4}
.escena[data-anim="jugar"] .prop{animation:aparecer 2s ease-out forwards}
.escena[data-anim="frio"] .char{animation:temblar .22s infinite}
.escena[data-anim="despertar"] .char{animation:saltar .5s ease-out 2}
@keyframes respirar{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes parpadear{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@keyframes aparecer{0%{opacity:0;transform:translateX(-50%) scale(.4)}18%{opacity:1;transform:translateX(-50%) scale(1)}78%{opacity:1;transform:translateX(-50%) scale(1)}100%{opacity:0;transform:translateX(-50%) scale(.8)}}
@keyframes masticar{0%,100%{height:10px;border-radius:0 0 22px 22px}50%{height:4px;border-radius:12px}}
@keyframes temblar{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
@keyframes mecer{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes subir{0%{opacity:0;transform:translateX(-50%) translateY(6px)}20%{opacity:1}70%{transform:translateX(-50%) translateY(-6px)}100%{opacity:0;transform:translateX(-50%) translateY(-14px)}}
@keyframes rascar{0%,100%{transform:rotate(0)}50%{transform:rotate(-30deg)}}
@keyframes latir{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes saltar{0%,100%{transform:translateY(0)}40%{transform:translateY(-12px)}}
@keyframes flotar{0%{opacity:0;transform:translateY(0) scale(.6)}25%{opacity:1}100%{opacity:0;transform:translateY(-62px) scale(1.25)}}
.animoWrap{display:flex;align-items:center;gap:8px;margin:9px 0}
.animoLabel{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;width:42px}
.bar{flex:1;height:9px;background:#0a1410;border:1px solid var(--line);border-radius:20px;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,#1f8f4d,#3ee07f);transition:width .4s;border-radius:20px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.tabs button{font:inherit;font-size:12px;padding:9px 2px;border-radius:11px;border:1px solid var(--line);background:var(--card2);color:var(--dim);cursor:pointer}
.tabs button.on{background:var(--card);color:var(--accent);border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:10px}
.q{font-size:15px;font-weight:600;margin-bottom:3px}
.hint{font-size:11.5px;color:var(--dim);margin-bottom:10px;line-height:1.5}
.inRow{display:flex;gap:7px}
input,select{font:inherit;font-size:13px;background:#0a100d;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:9px 11px;outline:none;width:100%}
input:focus,select:focus{border-color:var(--accent)}
.needs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.need{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px;font-size:11px;color:var(--dim)}
.need b{display:block;color:var(--txt);font-size:12px;margin-bottom:5px}
.mini{height:6px;background:#0a1410;border-radius:20px;overflow:hidden;margin-top:6px}
.mini i{display:block;height:100%;background:var(--accent);transition:width .4s}
.care{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.care .btn{padding:9px 3px;font-size:11.5px}
.row{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.hidden{display:none!important}
.mis label{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--dim);margin-bottom:6px}
.mis input{width:15px;height:15px;flex:none;accent-color:var(--accent)}
.msgs{max-height:44vh;overflow-y:auto;padding:2px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:86%;padding:8px 11px;border-radius:12px;font-size:13.5px;line-height:1.5;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:#1d3a29;border:1px solid #2c5a3d}
.msg.him{align-self:flex-start;background:var(--card);border:1px solid var(--line)}
.msg.sys{align-self:center;font-size:11px;color:var(--dim);background:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0}
.chip{font-size:11px;border:1px solid var(--line);background:var(--card);color:var(--dim);border-radius:20px;padding:4px 9px;cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.teach{margin-top:8px;font-size:11.5px;color:var(--warn);display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.ajustes{margin-top:9px;font-size:11.5px;color:var(--dim);display:flex;flex-direction:column;gap:7px}
.overlay{position:fixed;inset:0;background:rgba(6,10,8,.97);z-index:60;padding:calc(12px + env(safe-area-inset-top)) 13px 40px;overflow-y:auto;display:none}
.overlay.on{display:block}
.ovIn{max-width:560px;margin:0 auto}
.ovHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.ovHead b{font-size:15px}
.par{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px;margin-bottom:9px}
.par h4{margin:0 0 6px;font-size:13.5px;color:var(--accent)}
.par p{margin:0 0 7px;font-size:12.5px;line-height:1.6;color:#d3e2d8}
.par .ref{font-size:12px;color:var(--dim);font-style:italic;border-left:2px solid var(--accent);padding-left:8px}
.par.lock{opacity:.42}
.kv{font-size:12.5px;line-height:1.85;color:#d3e2d8}
.kv span{color:var(--dim)}
.conf{position:fixed;width:7px;height:11px;z-index:80;pointer-events:none;animation:caer 1.7s linear forwards}
@keyframes caer{to{transform:translateY(105vh) rotate(600deg);opacity:0}}
.jhead{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.jstat{background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:7px 4px;text-align:center;font-size:10px;color:var(--dim)}
.jstat b{display:block;font-size:14px;color:var(--txt);margin-bottom:2px}
.opciones{display:grid;gap:7px;margin-top:10px}
.op{font:inherit;font-size:13.5px;text-align:left;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--txt);cursor:pointer;transition:.15s}
.op:hover{border-color:var(--accent)}
.op.ok{background:#16402a;border-color:var(--accent);color:#c9ffdd}
.op.no{background:#3a1b1b;border-color:var(--bad);color:#ffd0d0}
.op.apagada{opacity:.32}
.tiempo{height:7px;background:#0a1410;border-radius:20px;overflow:hidden;margin-top:10px}
.tiempo i{display:block;height:100%;background:var(--accent);transition:width .25s linear}
.poderes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.poderes .btn{padding:9px 2px;font-size:10.5px}
.casaGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.pieza{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px}
.pieza .ico{font-size:22px}
.pieza .nom{font-size:12.5px;font-weight:600;margin:4px 0 2px}
.pieza .bon{font-size:10.5px;color:var(--dim);line-height:1.4;margin-bottom:6px}
.pieza .niv{display:flex;gap:3px;margin-bottom:7px}
.pieza .niv i{width:16px;height:5px;border-radius:3px;background:#1d2b23}
.pieza .niv i.on{background:var(--accent)}
.pieza .cos{font-size:10.5px;color:var(--warn);margin-bottom:6px}
.pieza .btn{width:100%;font-size:11px;padding:6px}
.pieza.tope{border-color:#2c5a3d}
.patio{position:relative;height:118px;border-radius:14px;border:1px dashed var(--line);background:linear-gradient(180deg,#0d1a12,#0a120d);margin-bottom:10px;overflow:hidden;display:flex;flex-wrap:wrap;align-content:flex-end;justify-content:center;gap:2px;padding:8px}
.patio span{font-size:26px;filter:grayscale(1) opacity(.22)}
.patio span.on{filter:none;animation:aparecer2 .6s ease-out}
@keyframes aparecer2{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.tip{font-size:11.5px;color:var(--dim);line-height:1.6}
.mats{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--dim);margin-bottom:8px}
.mats b{color:var(--txt)}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="dot"></span><b id="nombre">Jeyson</b><span class="lvl" id="lvlTxt">nivel 1</span></div>
  <div style="display:flex;gap:6px">
    <button class="btn ghost hidden" id="btnInstalar">instalar</button>
    <button class="btn ghost" id="btnFicha">ficha</button>
  </div>
</header>

<section class="escena" id="escena">
  <div class="char" id="char">
    <div class="cabeza"><div class="ojo i"></div><div class="ojo d"></div><div class="boca" id="boca"></div></div>
    <div class="torso"></div><div class="brazo i"></div><div class="brazo d"></div>
    <div class="prop" id="prop"></div>
    <div class="corazones" id="corazones"></div>
  </div>
  <div class="bubble" id="bubble">hola. soy Jeyson. tócame un rato, ¿sí?</div>
  <div class="sleep hidden" id="sleep" style="position:absolute;inset:0;background:rgba(3,5,4,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:20px;font-size:13px;color:var(--dim)">se apagó...<br><small>escríbele o toca un botón para despertarlo</small></div>
</section>

<div class="animoWrap">
  <div class="animoLabel">ánimo</div>
  <div class="bar"><div class="fill" id="animoFill" style="width:100%"></div></div>
</div>

<nav class="tabs">
  <button data-tab="cuidar" class="on">cuidar</button>
  <button data-tab="jugar">jugar</button>
  <button data-tab="hablar">hablar</button>
  <button data-tab="libro">libro</button>
</nav>

<main>
  <section id="tab-cuidar"></section>
  <section id="tab-jugar" class="hidden"></section>
  <section id="tab-hablar" class="hidden"></section>
  <section id="tab-libro" class="hidden"></section>
</main>

<div class="overlay" id="ov"><div class="ovIn" id="ovIn"></div></div>

<script src="./data/config.js"></script>
<script src="./data/preguntas.js"></script>
<script src="./js/anim.js"></script>
<script src="./js/juego.js"></script>
<script src="./js/app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function (error) {
      console.error('No se pudo registrar el service worker:', error);
    });
  });
}
</script>
</body>
</html>
